name: NODO Cloud Load Runner

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging API base URL"
        required: true
        default: "https://nodo-api-production.up.railway.app"
      scenario:
        description: "Scenario to run"
        required: true
        default: "health"
        type: choice
        options:
          - health
          - ready
          - version
          - marketplace
      requests:
        description: "Total requests"
        required: true
        default: "600"
      concurrency:
        description: "Concurrent requests"
        required: true
        default: "100"
      remitters:
        description: "Synthetic remitters for marketplace"
        required: true
        default: "100"
      profile_marketplace:
        description: "Request gated marketplace profile data for cost/DB/cache units"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  cloud-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ${{ secrets.NODO_STAGING_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: python -m pip install --upgrade httpx

      - name: Run cloud load scenario
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="gha_${{ github.run_id }}_${{ github.run_attempt }}_${{ inputs.scenario }}"
          PROFILE_ARGS=()
          if [ "${{ inputs.profile_marketplace }}" = "true" ]; then
            PROFILE_ARGS+=(--profile-marketplace)
          fi
          mkdir -p evidence/slice_runs
          python scripts/cloud_load_runner.py \
            --base-url "${{ inputs.base_url }}" \
            --scenario "${{ inputs.scenario }}" \
            --requests "${{ inputs.requests }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --remitters "${{ inputs.remitters }}" \
            --run-id "$RUN_ID" \
            --output "evidence/slice_runs/${RUN_ID}.json" \
            "${PROFILE_ARGS[@]}"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nodo-cloud-load-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/slice_runs/*.json
